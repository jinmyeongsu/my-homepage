<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>URL단축 | QRnShort</title><link rel="stylesheet" href="../style.css"><script src="script.js" defer></script></head><body><header><a class="brand" href="../index.html">QR<span>n</span>Short<span>.</span></a><a href="../../">시작 홈페이지 ↗</a></header><main><p class="eyebrow">PROJECT 06 · URL SHORTENER</p><h1>긴 주소를 짧게.</h1><p class="intro">공유하기 편한 짧은 링크를 만들고 복사하세요.</p><section class="panel"><form id="short-form"><label for="url">단축할 URL</label><div class="input-row"><input id="url" type="url" placeholder="https://example.com/long-address" required maxlength="2000"><button id="shorten" disabled>단축하기</button></div></form><p class="help">단축 요청 시 입력한 URL이 da.gd 서비스로 전송됩니다.</p><button class="secondary" id="example" type="button">내 시작 홈페이지 주소 넣기</button><p id="status" class="status" role="status"></p><div id="result" class="result" hidden><h2>URL 단축 완료</h2><label for="short-url">생성된 단축 URL</label><input id="short-url" readonly><p id="original-url" class="caption"></p><div class="actions"><button id="copy" type="button">복사</button><a id="open-short" class="button secondary" target="_blank" rel="noopener noreferrer">단축 주소 열기 ↗</a></div></div><p class="notes"><a href="../index.html">← QRnShort로 돌아가기</a> · 단축 서비스: <a href="https://da.gd/" target="_blank" rel="noopener noreferrer">da.gd</a></p></section></main><footer>QRnShort · 바이브 코딩 프로젝트04 + 프로젝트06</footer></body></html>
