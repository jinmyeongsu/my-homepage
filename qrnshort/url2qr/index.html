<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>URL2QR | QRnShort</title><link rel="stylesheet" href="../style.css"><script src="../vendor/qrcode.min.js" defer></script><script src="script.js" defer></script></head><body><header><a class="brand" href="../index.html">QR<span>n</span>Short<span>.</span></a><a href="../../">시작 홈페이지 ↗</a></header><main><p class="eyebrow">URL2QR</p><h1>주소를 QR코드로.</h1><p class="intro">링크를 입력하면 바로 스캔할 수 있는 QR코드를 만듭니다.</p><section class="panel"><form id="qr-form"><label for="url">변환할 URL</label><div class="input-row"><input id="url" type="url" placeholder="https://example.com" required maxlength="2000"><button id="generate" disabled>QR 생성</button></div></form><p class="help">http:// 또는 https://로 시작하는 주소를 입력하세요.</p><button class="secondary" id="example" type="button">내 시작 홈페이지 주소 넣기</button><p id="status" class="status" role="status"></p><div id="result" class="result" hidden><h2>QR코드 생성 완료</h2><canvas id="qr-canvas" aria-label="입력한 URL의 QR코드"></canvas><p id="encoded-url" class="caption"></p><div class="actions"><a id="download" class="button" download="url2qr.png">PNG 다운로드</a><a id="open-url" class="button secondary" target="_blank" rel="noopener noreferrer">원본 주소 열기 ↗</a></div></div><p class="notes"><a href="../index.html">← QRnShort로 돌아가기</a></p></section></main><footer>QRnShort</footer></body></html>
